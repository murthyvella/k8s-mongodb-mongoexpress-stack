apiVersion: apps/v1
kind: Deployment
metadata:
  name: mex-deploy
  labels:
    app: nani
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nani
  template:
    metadata:
      labels:
        app: nani
    spec:
      containers:
      - name: mongoexpress
        image: mongo-express
        ports:
        - containerPort: 8081
        env:
        - name: ME_CONFIG_MONGODB_ADMINUSERNAME
          valueFrom:
            secretKeyRef:
              name: mongo-secret
              key: mongo-root-username
        - name: ME_CONFIG_MONGODB_ADMINPASSWORD
          valueFrom:
            secretKeyRef:
              name: mongo-secret
              key: mongo-root-password
        - name: ME_CONFIG_MONGODB_SERVER
          valueFrom:
            configMapKeyRef:
               name: mongo-config
               key: database_url
